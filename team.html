<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NASA Space Apps Planet X | Team</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow&family=Barlow+Condensed:wght@400;700&family=Bellefair&display=swap" rel="stylesheet">
  <style>

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #000000; color: #ffffff; font-family: 'Barlow', sans-serif; min-height: 100vh; overflow-x: hidden; position: relative; }
    
    /* Twinkling Starfield Canvas */
    #starfield { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }

    /* Unified Heading Bar */
    header {
      position: relative;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.5rem 0 1.5rem 3rem;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 1rem;
      text-decoration: none;
      color: #fff;
    }
    .logo {
      width: 46px;
      height: 46px;
      background: #fff;
      color: #000;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-weight: bold;
      font-size: 1.4rem;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.35);
      flex-shrink: 0;
    }
    .brand-text span {
      display: block;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.8rem;
      letter-spacing: 3px;
      color: #D0D6F9;
      text-transform: uppercase;
    }
    .brand-text strong {
      font-family: 'Bellefair', serif;
      font-size: 1.25rem;
      font-weight: 400;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    nav {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 0 5rem 0 3.5rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.15);
      border-left: 1px solid rgba(255, 255, 255, 0.1);
    }
    nav ul {
      display: flex;
      list-style: none;
      gap: 2.8rem;
    }
    nav a {
      display: inline-block;
      padding: 1.6rem 0;
      color: #fff;
      text-decoration: none;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 1rem;
      letter-spacing: 2.7px;
      text-transform: uppercase;
      border-bottom: 3px solid transparent;
      transition: border-color 0.25s ease;
    }
    nav a b {
      margin-right: 0.55rem;
    }
    nav a:hover {
      border-bottom-color: rgba(255, 255, 255, 0.5);
    }
    nav a.active {
      border-bottom-color: #fff;
    }
    @media (max-width: 860px) {
      header { padding-left: 1.5rem; }
      nav { padding: 0 1.5rem; }
      nav ul { gap: 1.4rem; }
    }

    main { position: relative; z-index: 5; max-width: 1180px; margin: 0 auto; padding: 1.5rem 2rem 4rem; }
    .page-title { font-family: 'Barlow Condensed', sans-serif; font-size: 1.75rem; letter-spacing: 4.72px; text-transform: uppercase; font-weight: 400; margin-bottom: 0.5rem; }
    .page-title span { opacity: 0.3; font-weight: 700; margin-right: 0.9rem; }
    .sub { color: #D0D6F9; margin-bottom: 2.5rem; font-size: 1.05rem; }

    /* Normal 6-Rectangle Grid (3x2) */
    .team-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2rem; }
    .member-card { background: rgba(12, 15, 29, 0.85); border: 1px solid rgba(255, 255, 255, 0.18); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; transition: border-color 0.25s ease, transform 0.25s ease; }
    .member-card:hover { border-color: #ffffff; transform: translateY(-4px); }
    .photo-box { width: 100%; height: 220px; background: #080a14; border-bottom: 1px solid rgba(255, 255, 255, 0.12); overflow: hidden; }
    .photo-box img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .card-body { padding: 1.5rem; display: flex; flex-direction: column; gap: 0.5rem; flex: 1; }
    .role { font-family: 'Barlow Condensed', sans-serif; font-size: 0.85rem; letter-spacing: 2.5px; text-transform: uppercase; color: #D0D6F9; }
    .name { font-family: 'Bellefair', serif; font-size: 1.75rem; font-weight: 400; text-transform: uppercase; color: #ffffff; }
    .email-row { margin-top: auto; padding-top: 1rem; border-top: 1px solid rgba(255, 255, 255, 0.12); display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; }
    .email-link { color: #D0D6F9; text-decoration: none; font-size: 0.92rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .email-link:hover { color: #ffffff; text-decoration: underline; }
    .copy-btn { background: rgba(255, 255, 255, 0.08); color: #ffffff; border: 1px solid rgba(255, 255, 255, 0.25); padding: 0.35rem 0.8rem; border-radius: 20px; font-family: 'Barlow Condensed', sans-serif; font-size: 0.8rem; letter-spacing: 1.5px; text-transform: uppercase; cursor: pointer; flex-shrink: 0; }
    .copy-btn:hover { background: #ffffff; color: #000000; }

    @media (max-width: 960px) { .team-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 620px) { .team-grid { grid-template-columns: 1fr; } }
  
    /* ===== Interactive layer (shared by Home / Explore / Team) ===== */
    .fx-progress { position: fixed; top: 0; left: 0; width: 100%; height: 2px; transform: scaleX(0); transform-origin: 0 50%; background: linear-gradient(90deg, #8d97d9, #fff); box-shadow: 0 0 10px rgba(208, 214, 249, 0.6); z-index: 300; pointer-events: none; }
    .fx-halo { position: fixed; left: 0; top: 0; width: 34px; height: 34px; margin: -17px 0 0 -17px; border: 1px solid rgba(208, 214, 249, 0.55); border-radius: 50%; pointer-events: none; z-index: 400; opacity: 0; transition: opacity 0.25s, width 0.2s, height 0.2s, margin 0.2s, background 0.2s, border-color 0.2s; }
    .fx-halo.on { opacity: 1; }
    .fx-halo.hot { width: 58px; height: 58px; margin: -29px 0 0 -29px; background: rgba(208, 214, 249, 0.08); border-color: #fff; }
    .fx-halo.down { width: 22px; height: 22px; margin: -11px 0 0 -11px; }
    @media (pointer: coarse) { .fx-halo { display: none; } }
    .brand .logo { transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.3s ease; }
    .brand:hover .logo { transform: rotate(180deg) scale(1.08); box-shadow: 0 0 30px rgba(255, 255, 255, 0.65); }
    .article-card, .member-card { position: relative; }
    .article-card::before, .member-card::before { content: ""; position: absolute; inset: 0; z-index: 2; pointer-events: none; opacity: 0; transition: opacity 0.3s ease; background: radial-gradient(260px circle at var(--mx, 50%) var(--my, 50%), rgba(208, 214, 249, 0.14), transparent 62%); }
    .article-card:hover::before, .member-card:hover::before { opacity: 1; }
    .member-card .photo-box img { transition: transform 0.45s ease; }
    .member-card:hover .photo-box img { transform: scale(1.06); }
    .explore-btn, .spin { will-change: translate; transition: translate 0.25s ease-out, transform 0.3s ease; }
    @media (prefers-reduced-motion: reduce) { .fx-halo, .fx-shoot { display: none; } }
  </style>
</head>
<body>

  <canvas id="starfield"></canvas>
  <header>
    <a href="home.html" class="brand">
      <div class="logo">✦</div>
      <div class="brand-text">
        <span>NASA Space Apps</span>
        <strong>Planet X</strong>
      </div>
    </a>
    <nav>
      <ul>
        <li><a href="home.html" class=""><b>00</b> Home</a></li>
        <li><a href="explore.html" class=""><b>01</b> Explore</a></li>
        <li><a href="team.html" class="active"><b>02</b> Team</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h1 class="page-title"><span>02</span> Meet our team</h1>
    <p class="sub">Direct mission contacts, roles, and team leads.</p>
    <div class="team-grid" id="teamGrid"></div>
  </main>
  <script>

    (function(){
    // Interactive pure-black starfield (same as Home): click to add particles, constellation lines follow the cursor
    const canvas = document.getElementById("starfield");
    const ctx = canvas.getContext("2d");
    const countEl = document.getElementById("particleCount") || { textContent: "" };
    let width, height;
    const stars = [];
    const bursts = [];
    const mouse = { x: -9999, y: -9999 };
    const MAX_STARS = 750;

    function createStar(x, y, boosted = false) {
      return {
        x: x !== undefined ? x : Math.random() * width,
        y: y !== undefined ? y : Math.random() * height,
        r: boosted ? (Math.random() * 2.2 + 0.8) : (Math.random() * 1.7 + 0.35),
        vx: boosted ? ((Math.random() - 0.5) * 1.1) : ((Math.random() - 0.5) * 0.22),
        vy: boosted ? ((Math.random() - 0.5) * 1.1) : ((Math.random() - 0.5) * 0.22),
        alpha: boosted ? 1 : (Math.random() * 0.7 + 0.25),
        twinkle: Math.random() * 0.025 + 0.008,
        glow: boosted ? 1.0 : 0
      };
    }
    function initStars() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      if (stars.length === 0) {
        for (let i = 0; i < 140; i++) stars.push(createStar());
        countEl.textContent = stars.length;
      }
    }
    window.addEventListener("resize", initStars);
    initStars();
    window.addEventListener("pointermove", (e) => { mouse.x = e.clientX; mouse.y = e.clientY; });
    document.documentElement.addEventListener("pointerleave", () => { mouse.x = -9999; mouse.y = -9999; });

    window.addEventListener("click", (e) => {
      if (e.target.closest("a, button, input, select, textarea, label, summary, details, .stage, #md, #cele, .member-card, .article-card, .reader-panel, nav")) return;
      for (let i = 0; i < 18; i++) {
        if (stars.length >= MAX_STARS) stars.shift();
        stars.push(createStar(e.clientX + (Math.random() - 0.5) * 70, e.clientY + (Math.random() - 0.5) * 70, true));
      }
      countEl.textContent = stars.length;
      bursts.push({ x: e.clientX, y: e.clientY, radius: 6, alpha: 0.75 });
    });

    function animateSpace() {
      ctx.fillStyle = "#000000";
      ctx.fillRect(0, 0, width, height);
      if (mouse.x > 0 && mouse.y > 0) {
        const grad = ctx.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, 240);
        grad.addColorStop(0, "rgba(208, 214, 249, 0.09)");
        grad.addColorStop(1, "rgba(0, 0, 0, 0)");
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, width, height);
      }
      for (let i = 0; i < stars.length; i++) {
        const s = stars[i];
        s.x += s.vx; s.y += s.vy;
        if (Math.abs(s.vx) > 0.25) s.vx *= 0.97;
        if (Math.abs(s.vy) > 0.25) s.vy *= 0.97;
        if (s.glow > 0) s.glow = Math.max(0, s.glow - 0.015);
        if (s.x < 0) s.x = width;
        if (s.x > width) s.x = 0;
        if (s.y < 0) s.y = height;
        if (s.y > height) s.y = 0;
        s.alpha += s.twinkle;
        if (s.alpha > 1 || s.alpha < 0.2) s.twinkle *= -1;
        const dx = mouse.x - s.x, dy = mouse.y - s.y, dist = Math.hypot(dx, dy);
        if (dist < 155) {
          ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(mouse.x, mouse.y);
          ctx.strokeStyle = `rgba(208, 214, 249, ${(1 - dist / 155) * 0.32})`;
          ctx.lineWidth = 0.8; ctx.stroke();
          s.x -= dx * 0.0025; s.y -= dy * 0.0025;
        }
        for (let j = i + 1; j < stars.length; j++) {
          const s2 = stars[j], pDist = Math.hypot(s.x - s2.x, s.y - s2.y);
          if (pDist < 75) {
            ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(s2.x, s2.y);
            ctx.strokeStyle = `rgba(208, 214, 249, ${(1 - pDist / 75) * 0.14})`;
            ctx.lineWidth = 0.6; ctx.stroke();
          }
        }
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r + s.glow * 1.4, 0, Math.PI * 2);
        ctx.fillStyle = s.glow > 0 ? `rgba(255, 255, 255, ${Math.min(1, s.alpha + s.glow)})` : `rgba(255, 255, 255, ${s.alpha})`;
        ctx.fill();
      }
      for (let i = bursts.length - 1; i >= 0; i--) {
        const b = bursts[i];
        b.radius += 3.2; b.alpha -= 0.025;
        if (b.alpha <= 0) { bursts.splice(i, 1); continue; }
        ctx.beginPath(); ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(208, 214, 249, ${b.alpha})`;
        ctx.lineWidth = 1.2; ctx.stroke();
      }
      requestAnimationFrame(animateSpace);
    }
    animateSpace();
  })();

    const members = [
      { role: "Graphic Design", name: "Mohsen Muhammed", email: "mohsen.mo.elsayed@gmail.com", img: "member1.png" },
      { role: "Researcher", name: "Salma Khaled", email: "salmakhaled.soliman5@gmail.com", img: "member2.png" },
      { role: "Web Front-end", name: "Yosef Shamsaldeen", email: "yosef.a.shamsaldeen@gmail.com", img: "member3.png" },
      { role: "Researcher", name: "Mostafa Ahmed", email: "mostafaahmed5332442@gmail.com", img: "member4.png" },
      { role: "Data engineer, Research, Project lead", name: "Elsayed Elmandoh", email: "systems@planetx.space", img: "member5.png" },
      { role: "Coding and Development", name: "Hazem Imam", email: "navigation@planetx.space", img: "member6.png" }
    ];

    const fallbackSvg = "data:image/svg+xml;utf8," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="400" height="260" viewBox="0 0 400 260"><rect width="400" height="260" fill="#090c18"/><circle cx="200" cy="100" r="42" fill="#1d2542"/><path d="M120 230c0-44 36-75 80-75s80 31 80 75" fill="#1d2542"/></svg>');

    const grid = document.getElementById("teamGrid");
    members.forEach(m => {
      const card = document.createElement("div");
      card.className = "member-card";
      card.innerHTML = `
        <div class="photo-box"><img src="${m.img}" onerror="this.src='${fallbackSvg}'" alt="${m.name}"></div>
        <div class="card-body">
          <div class="role">${m.role}</div>
          <h2 class="name">${m.name}</h2>
          <div class="email-row">
            <a class="email-link" href="mailto:${m.email}">${m.email}</a>
            <button class="copy-btn" onclick="copyEmail(this, '${m.email}')">Copy</button>
          </div>
        </div>
      `;
      grid.appendChild(card);
    });

    function copyEmail(btn, email) {
      navigator.clipboard.writeText(email);
      const orig = btn.textContent;
      btn.textContent = "Copied!";
      setTimeout(() => btn.textContent = orig, 1500);
    }
  </script>

  <script>
  (function () {
    var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    var fine = matchMedia('(hover: hover) and (pointer: fine)').matches;

    // 1. Reading-progress bar
    var bar = document.createElement('div'); bar.className = 'fx-progress'; document.body.appendChild(bar);
    function prog() { var h = document.documentElement.scrollHeight - innerHeight; bar.style.transform = 'scaleX(' + (h > 0 ? Math.min(1, scrollY / h) : 0) + ')'; }
    addEventListener('scroll', prog, { passive: true }); addEventListener('resize', prog); prog();

    // 2. Cursor halo that grows over anything clickable
    if (fine && !reduce) {
      var halo = document.createElement('div'); halo.className = 'fx-halo'; document.body.appendChild(halo);
      var tx = 0, ty = 0, hx = 0, hy = 0;
      addEventListener('pointermove', function (e) {
        tx = e.clientX; ty = e.clientY; halo.classList.add('on');
        halo.classList.toggle('hot', !!e.target.closest('a, button, input, select, summary, label, .stage, #trk, .member-card, .article-card'));
      });
      document.documentElement.addEventListener('pointerleave', function () { halo.classList.remove('on'); });
      addEventListener('pointerdown', function () { halo.classList.add('down'); });
      addEventListener('pointerup', function () { halo.classList.remove('down'); });
      (function follow() { hx += (tx - hx) * 0.2; hy += (ty - hy) * 0.2; halo.style.transform = 'translate(' + hx + 'px,' + hy + 'px)'; requestAnimationFrame(follow); })();
    }

    // 3. Card spotlight + 3D tilt, and magnetic Explore / Spin buttons (event delegation, works for re-rendered cards)
    if (fine && !reduce) {
      var lastCard = null;
      function resetCard(c) { if (c) { c.style.transform = ''; } }
      document.addEventListener('pointermove', function (e) {
        var card = e.target.closest('.article-card, .member-card');
        if (lastCard && lastCard !== card) resetCard(lastCard);
        lastCard = card;
        if (card) {
          var r = card.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
          card.style.setProperty('--mx', x + 'px'); card.style.setProperty('--my', y + 'px');
          var lift = card.classList.contains('member-card') ? -4 : -6;
          card.style.transform = 'perspective(900px) rotateX(' + ((0.5 - y / r.height) * 7).toFixed(2) + 'deg) rotateY(' + ((x / r.width - 0.5) * 7).toFixed(2) + 'deg) translateY(' + lift + 'px)';
        }
        document.querySelectorAll('.explore-btn, .spin').forEach(function (b) {
          var r = b.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2, d = Math.hypot(e.clientX - cx, e.clientY - cy), reach = Math.max(r.width, r.height);
          b.style.translate = d < reach ? ((e.clientX - cx) * 0.18).toFixed(1) + 'px ' + ((e.clientY - cy) * 0.18).toFixed(1) + 'px' : '0px 0px';
        });
      });
      document.documentElement.addEventListener('pointerleave', function () { resetCard(lastCard); lastCard = null; });
    }

    // 4. Occasional shooting star (rare, sits between the starfield and the content)
    if (!reduce) {
      var c = document.createElement('canvas'); c.className = 'fx-shoot';
      c.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none';
      document.body.appendChild(c);
      var x = c.getContext('2d'), W, H, streaks = [], next = 2500;
      function size() { W = c.width = innerWidth; H = c.height = innerHeight; }
      addEventListener('resize', size); size();
      var last = performance.now();
      (function loop(t) {
        var dt = t - last; last = t; next -= dt;
        if (next <= 0 && !document.hidden) {
          var a = (22 + Math.random() * 16) * Math.PI / 180;
          streaks.push({ x: Math.random() * W * 0.8, y: Math.random() * H * 0.45, vx: Math.cos(a) * (11 + Math.random() * 5), vy: Math.sin(a) * (11 + Math.random() * 5), life: 1 });
          next = 5000 + Math.random() * 7000;
        }
        x.clearRect(0, 0, W, H);
        for (var i = streaks.length - 1; i >= 0; i--) {
          var s = streaks[i]; s.x += s.vx; s.y += s.vy; s.life -= 0.016;
          if (s.life <= 0) { streaks.splice(i, 1); continue; }
          var g = x.createLinearGradient(s.x, s.y, s.x - s.vx * 9, s.y - s.vy * 9);
          g.addColorStop(0, 'rgba(255,255,255,' + s.life + ')'); g.addColorStop(1, 'rgba(208,214,249,0)');
          x.strokeStyle = g; x.lineWidth = 1.6; x.beginPath(); x.moveTo(s.x, s.y); x.lineTo(s.x - s.vx * 9, s.y - s.vy * 9); x.stroke();
        }
        requestAnimationFrame(loop);
      })(last);
    }
  })();
  </script>
</body>
</html>
